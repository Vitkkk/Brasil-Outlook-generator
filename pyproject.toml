[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazil-severe-weather-outlook"
version = "0.1.0"
description = "Automatic severe convective weather outlook system for Brazil"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "pandas>=2.2,<3",
  "xarray>=2024.7",
  "dask[array]>=2024.7",
  "zarr>=2.18,<4",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "metpy>=1.6,<2"
]

[project.optional-dependencies]
grib = ["cfgrib>=0.9.14", "eccodes>=2.37"]
geospatial = ["geopandas>=1.0,<2", "cartopy>=0.23,<1"]
database = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "geoalchemy2>=0.15,<1"]
dev = ["pytest>=8.2,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
