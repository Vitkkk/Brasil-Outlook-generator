name: Multimodel GFS ECMWF WRF V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/models/wrf_cptec.py"
      - "scripts/generate_multimodel_day1_v2_wrf.py"
      - "scripts/render_model_day1_v3.py"
      - "scripts/render_multimodel_day1_v1.py"
      - ".github/workflows/multimodel-wrf-v2.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[grib,dev]" matplotlib cartopy ecmwf-opendata requests
      - name: Unit tests
        run: pytest -q
      - name: Generate GFS + ECMWF + CPTEC WRF Day-1
        env:
          PYTHONPATH: backend
        run: |
          set +e
          python scripts/generate_multimodel_day1_v2_wrf.py --hours 0,6,12,18,24
          CODE=$?
          if [ $CODE -ne 0 ] && [ $CODE -ne 139 ]; then exit $CODE; fi
          echo "Generator exit code $CODE; preserving completed outputs"
      - name: Render GFS, ECMWF, WRF and three-model consensus
        env:
          PYTHONPATH: backend
        run: |
          OUTDIR=$(find output/multimodel-wrf-v2 -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)

          python scripts/render_model_day1_v3.py \
            "$OUTDIR/gfs_day1_v3.nc" \
            "$OUTDIR/brazil_gfs_day1_outlook.png" \
            --manifest "$OUTDIR/manifest.json" --model "GFS"

          python scripts/render_model_day1_v3.py \
            "$OUTDIR/ecmwf_day1_v3.nc" \
            "$OUTDIR/brazil_ecmwf_day1_outlook.png" \
            --manifest "$OUTDIR/manifest.json" --model "ECMWF"

          python scripts/render_model_day1_v3.py \
            "$OUTDIR/wrf_cptec_7km_day1_v3.nc" \
            "$OUTDIR/brazil_wrf_cptec_7km_day1_outlook.png" \
            --manifest "$OUTDIR/manifest.json" --model "WRF-CPTEC-7KM"

          python scripts/render_multimodel_day1_v1.py \
            "$OUTDIR/multimodel_day1_consensus_v2_wrf.nc" \
            "$OUTDIR/brazil_gfs_ecmwf_wrf_consensus_day1_outlook.png" \
            --manifest "$OUTDIR/manifest.json"
      - name: Upload complete multimodel Day-1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: multimodel-gfs-ecmwf-wrf-v2
          path: output/multimodel-wrf-v2/**
          retention-days: 7
          if-no-files-found: error

