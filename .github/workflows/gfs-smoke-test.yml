name: GFS live smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[grib]" matplotlib cartopy

      - name: Unit tests
        run: pytest -q

      - name: Generate live GFS Day-1 proxy
        env:
          PYTHONPATH: backend
        run: |
          python scripts/generate_gfs_day1.py --hours 0,6,12,18,24

      - name: Render four-panel outlook
        env:
          PYTHONPATH: backend
        run: |
          OUTDIR=$(find output/gfs -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          python - "$OUTDIR" <<'PY' > /tmp/render_env
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          m = json.loads((p / "manifest.json").read_text())
          cycle = m["cycle"].replace("+00:00", "Z")
          valid = f'{m["valid_start"].replace("+00:00", "Z")} – {m["valid_end"].replace("+00:00", "Z")}'
          print(f'OUTDIR={p}')
          print(f'CYCLE={cycle}')
          print(f'VALID={valid}')
          PY
          source /tmp/render_env
          python scripts/render_gfs_day1.py \
            "$OUTDIR/gfs_day1_proxy_fields.nc" \
            "$OUTDIR/brazil_gfs_day1_outlook.png" \
            --cycle "$CYCLE" \
            --valid "$VALID"

      - name: Upload GFS outlook artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfs-day1-outlook
          path: |
            output/gfs/**/brazil_gfs_day1_outlook.png
            output/gfs/**/categorical.geojson
            output/gfs/**/tornado.geojson
            output/gfs/**/hail.geojson
            output/gfs/**/wind.geojson
            output/gfs/**/manifest.json
          if-no-files-found: error
          retention-days: 7
