name: Multimodel deterministic consensus V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/models/ecmwf.py"
      - "backend/app/hazards/model_diagnostics_v3.py"
      - "backend/app/ensemble/multimodel_v1.py"
      - "scripts/generate_multimodel_day1_v1.py"
      - "scripts/render_multimodel_day1_v1.py"
      - "scripts/render_model_day1_v3.py"
      - "scripts/render_prevots_mode.py"
      - "scripts/generate_multimodel_prevots_day1.py"
      - "backend/app/outlook/prevots_mode.py"
      - ".github/workflows/multimodel-v1.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[grib,dev]" matplotlib cartopy ecmwf-opendata
      - name: Unit tests
        run: pytest -q
      - name: Generate common-cycle GFS + ECMWF Day-1 consensus
        env:
          PYTHONPATH: backend
        run: |
          set +e
          python scripts/generate_multimodel_day1_v1.py --hours 0,6,12,18,24
          CODE=$?
          if [ $CODE -ne 0 ] && [ $CODE -ne 134 ] && [ $CODE -ne 139 ]; then exit $CODE; fi
          echo "Generator exit code $CODE; preserving completed outputs"
      - name: Generate PREVOTS-style 12Z-to-12Z guidance
        env:
          PYTHONPATH: backend
        run: |
          set +e
          python scripts/generate_multimodel_prevots_day1.py
          CODE=$?
          if [ $CODE -ne 0 ] && [ $CODE -ne 134 ] && [ $CODE -ne 139 ]; then exit $CODE; fi
          echo "PREVOTS generator exit code $CODE; preserving completed outputs"
      - name: Render GFS, ECMWF and consensus outlooks
        env:
          PYTHONPATH: backend
        run: |
          OUTDIR=$(find output/multimodel-v1 -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)

          python scripts/render_model_day1_v3.py \
            "$OUTDIR/gfs_day1_v3.nc" \
            "$OUTDIR/brazil_gfs_day1_outlook.png" \
            --manifest "$OUTDIR/manifest.json" --model "GFS"

          python scripts/render_model_day1_v3.py \
            "$OUTDIR/ecmwf_day1_v3.nc" \
            "$OUTDIR/brazil_ecmwf_day1_outlook.png" \
            --manifest "$OUTDIR/manifest.json" --model "ECMWF"

          python scripts/render_multimodel_day1_v1.py \
            "$OUTDIR/multimodel_day1_consensus_v1.nc" \
            "$OUTDIR/brazil_gfs_ecmwf_consensus_day1_outlook.png" \
            --manifest "$OUTDIR/manifest.json"

          PREVOUT=$(find output/prevots-mode -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          python scripts/render_prevots_mode.py \
            "$PREVOUT/multimodel_prevots_consensus_v1.nc" \
            "$PREVOUT/brazil_prevots_mode_day1.png" \
            --manifest "$PREVOUT/manifest.json" --model "CONSENSUS" \
            --gfs-netcdf "$PREVOUT/gfs_prevots_day1_v3.nc" \
            --ecmwf-netcdf "$PREVOUT/ecmwf_prevots_day1_v3.nc"
      - name: Upload multimodel artifact
        uses: actions/upload-artifact@v4
        with:
          name: multimodel-consensus-v1
          path: |
            output/multimodel-v1/**
            output/prevots-mode/**
          retention-days: 7
          if-no-files-found: error

