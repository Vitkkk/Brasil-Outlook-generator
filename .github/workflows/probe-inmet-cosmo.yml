name: Probe INMET COSMO feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_inmet_cosmo.py"
      - ".github/workflows/probe-inmet-cosmo.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe INMET COSMO FTP
        run: python scripts/probe_inmet_cosmo.py
