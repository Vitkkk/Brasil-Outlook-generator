name: GFS Diagnostics V2 outlook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/hazards/gfs_diagnostics_v2.py"
      - "backend/app/models/gfs.py"
      - "scripts/generate_gfs_day1_v2.py"
      - "scripts/render_gfs_day1_v2.py"
      - "tests/test_gfs_diagnostics_v2.py"
      - ".github/workflows/gfs-diagnostics-v2.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[grib,dev]" matplotlib cartopy

      - name: Unit tests
        run: pytest -q

      - name: Generate live GFS Diagnostics V2 Day-1 outlook
        env:
          PYTHONPATH: backend
        run: |
          python scripts/generate_gfs_day1_v2.py --hours 0,3,6,9,12,15,18,21,24

      - name: Render V2 four-panel outlook
        env:
          PYTHONPATH: backend
        run: |
          OUTDIR=$(find output/gfs-v2 -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          python - "$OUTDIR" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          p = pathlib.Path(sys.argv[1])
          m = json.loads((p / "manifest.json").read_text())
          cycle = m["cycle"].replace("+00:00", "Z")
          valid = f'{m["valid_start"].replace("+00:00", "Z")} – {m["valid_end"].replace("+00:00", "Z")}'
          subprocess.run(
              [
                  sys.executable,
                  "scripts/render_gfs_day1_v2.py",
                  str(p / "gfs_day1_diagnostics_v2.nc"),
                  str(p / "brazil_gfs_day1_outlook_v2.png"),
                  "--cycle",
                  cycle,
                  "--valid",
                  valid,
                  "--manifest",
                  str(p / "manifest.json"),
              ],
              check=True,
          )
          PY

      - name: Upload V2 outlook artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfs-diagnostics-v2-outlook
          path: |
            output/gfs-v2/**/brazil_gfs_day1_outlook_v2.png
            output/gfs-v2/**/gfs_day1_diagnostics_v2.nc
            output/gfs-v2/**/categorical.geojson
            output/gfs-v2/**/tornado.geojson
            output/gfs-v2/**/hail.geojson
            output/gfs-v2/**/wind.geojson
            output/gfs-v2/**/supercell.geojson
            output/gfs-v2/**/qlcs.geojson
            output/gfs-v2/**/convective_initiation.geojson
            output/gfs-v2/**/sig_tornado_support.geojson
            output/gfs-v2/**/manifest.json
          if-no-files-found: error
          retention-days: 7
